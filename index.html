<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>FamDash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161a24;
    --bg2: #1e2330;
    --ink: #f4efe6;
    --muted: #a7a9b4;
    --line: rgba(255,255,255,.09);
    --warm: #ffc56b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 20% 0%, #222a3b 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    cursor: none;
  }
  h1, h2, .display { font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 600; }

  .view {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    padding: 3.2vh 3.6vw 6vh;
    opacity: 0; visibility: hidden;
    transition: opacity .9s ease, visibility 0s linear .9s;
  }
  .view.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }

  /* clock — shared */
  .clock {
    position: absolute; top: 2.6vh; right: 3.6vw; z-index: 5; text-align: right;
    text-shadow: 0 2px 12px rgba(0,0,0,.45);
  }
  .clock .row { display: flex; align-items: center; justify-content: flex-end; gap: 2.2vw; }
  .clock .t { font-family: 'Fredoka', sans-serif; font-size: 7.2vh; line-height: 1; font-weight: 500; letter-spacing: .01em; }
  .wx { display: flex; align-items: center; gap: .7vw; font-family: 'Fredoka', sans-serif; font-size: 5vh; font-weight: 500; line-height: 1; }
  .wx svg { width: 6.2vh; height: 6.2vh; display: block; overflow: visible; }
  .wx:empty { display: none; }
  .clock .d { font-size: 2.5vh; color: var(--muted); font-weight: 700; margin-top: .4vh; }
  body.photo-on .clock .d { color: #fff; opacity: .85; }
  body.lunch-on .clock .d { display: none; }
  body.photo-on .clock, body.quotes-on .clock { text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  body.quotes-on .clock .d { color: #fff; opacity: .85; }

  /* calendar */
  #v-calendar { display: flex; flex-direction: column; }
  #v-calendar h1 { font-size: 5.4vh; margin-bottom: 5vh; }   /* agenda starts below the clock + date */
  #v-calendar h1 span { color: var(--warm); }
  .agenda { column-count: 2; column-gap: 4vw; column-fill: auto; flex: 1; min-height: 0; overflow: hidden; }
  .more { color: var(--muted); font-size: 2.2vh; font-weight: 700; padding-top: .6vh; break-inside: avoid; }
  .day { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 2.4vh; }
  .day h2 {
    font-size: 2.7vh; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: .7vh; margin-bottom: 1vh; font-weight: 500;
  }
  .day.today h2 { color: var(--warm); }
  .ev { display: flex; align-items: stretch; gap: 1.4vw; padding: .9vh 0; }
  .ev .when { width: 9.5vw; min-width: 80px; flex: none; font-weight: 800; font-size: 2.6vh; padding-top: .2vh; font-variant-numeric: tabular-nums; }
  .ev .when.all { color: var(--muted); font-weight: 700; font-size: 2.2vh; padding-top: .5vh; }
  .ev .bar { width: 5px; border-radius: 3px; flex: none; }
  .ev .what { font-size: 2.9vh; font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .ev .sub { font-size: 2.1vh; color: var(--muted); margin-top: .3vh; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev > div:last-child { min-width: 0; }
  .ev.now .when { color: var(--warm); }
  .empty { color: var(--muted); font-size: 3vh; margin-top: 4vh; }

  /* jars */
  #v-jars { display: flex; align-items: center; justify-content: center; gap: 6vw; padding-top: 6vh; }
  .kid { display: flex; flex-direction: column; align-items: center; width: 34vw; max-width: 46vh; }
  .kid .name { font-family: 'Fredoka', sans-serif; font-size: 6vh; margin-bottom: 1.4vh; display: flex; align-items: center; gap: .6vw; }
  .kid .jar { width: 100%; }
  .kid.solo { width: 46vw; max-width: 47vh; }
  #v-jars.n3 { gap: 3vw; } #v-jars.n3 .kid { width: 27vw; max-width: 40vh; }
  #v-jars.n4 { gap: 2vw; } #v-jars.n4 .kid { width: 21vw; max-width: 34vh; } #v-jars.n4 .kid .name { font-size: 4.6vh; }
  .jar-svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 18px 28px rgba(0,0,0,.35)); }
  .jar-goal { font: 700 13px 'Nunito', sans-serif; fill: rgba(255,255,255,.55); }
  .kid .count { margin-top: 1.8vh; font-size: 3vh; color: var(--muted); font-weight: 700; }
  .kid .count b { font-family: 'Fredoka', sans-serif; font-size: 6.4vh; color: var(--ink); font-weight: 600; margin-right: .5vw; vertical-align: -0.6vh; }
  .badge { font-size: 2.2vh; background: var(--warm); color: #3a2400; border-radius: 99px; padding: .4vh 1.1vw; font-family: 'Nunito'; font-weight: 800; }
  .marble.drop { animation: drop 1s cubic-bezier(.34,1.32,.55,1) both; }
  .marble.lift { animation: lift 1.1s ease-in both; }
  @keyframes drop { 0% { transform: translateY(-470px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(0); } }
  @keyframes lift { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-420px); opacity: 0; } }

  /* photo */
  #v-photo { padding: 0; background: #000; }
  #v-photo .blur { position: absolute; top: -40px; right: -40px; bottom: -40px; left: -40px; background-size: cover; background-position: center; filter: blur(32px) brightness(.55); }
  #v-photo img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

  /* lunch */
  #v-lunch { display: flex; flex-direction: column; }
  #v-lunch h1 { font-size: 5.4vh; margin-bottom: 2.2vh; }
  #v-lunch h1 span { color: var(--warm); }
  .lunch-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .lunch-card { background: #fff; border-radius: 18px; padding: 1.2vh; box-shadow: 0 18px 40px rgba(0,0,0,.35); line-height: 0; }
  .lunch-card canvas, .lunch-card img { display: block; border-radius: 8px; }
  /* weekly layout: Mon Tue Wed / Thu Fri + daily options */
  .lw { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 1.8vh 1.4vw; }
  .lw-cell { background: #fff; border-radius: 1.6vh; display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,.3); }
  .lw-cell .lbl { flex: none; background: #2a3142; color: var(--ink); font: 600 2.6vh 'Fredoka', sans-serif; padding: .7vh 1vw; display: flex; justify-content: space-between; align-items: baseline; }
  .lw-cell .lbl small { font: 700 1.8vh 'Nunito', sans-serif; color: var(--muted); }
  .lw-cell.today { box-shadow: 0 0 0 .5vh var(--warm), 0 12px 28px rgba(0,0,0,.3); }
  .lw-cell.today .lbl { background: var(--warm); color: #2b1a00; }
  .lw-cell.today .lbl small { color: #5a3a00; }
  .lw-cell.past { opacity: .55; }
  .lw-cell .img { flex: 1; min-height: 0; padding: .6vh; display: flex; align-items: center; justify-content: center; }
  .lw-cell canvas { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; }

  /* shared page layout for the newer views */
  .page { display: flex; flex-direction: column; }
  .page > h1 { font-size: 5.4vh; margin-bottom: 5vh; flex: none; }
  .page > h1 span { color: var(--warm); }
  .page > .body { flex: 1; min-height: 0; }
  .card { background: rgba(255,255,255,.045); border: 1px solid var(--line); border-radius: 2vh; }

  /* weather */
  #v-weather .body { display: grid; grid-template-columns: 1.4fr 1fr; gap: 3vw; }
  .wx-left { display: flex; flex-direction: column; gap: 2.4vh; min-height: 0; }
  .wx-now { display: flex; align-items: center; gap: 2.4vw; }
  .wx-now svg { width: 13vh; height: 13vh; overflow: visible; flex: none; }
  .wx-now .big { font-family: 'Fredoka', sans-serif; font-size: 11vh; line-height: 1; font-weight: 500; }
  .wx-now .desc { font-size: 3vh; font-weight: 800; }
  .wx-now .meta { font-size: 2.3vh; color: var(--muted); font-weight: 700; margin-top: .6vh; }
  .wx-hours { display: flex; padding: 1.4vh .6vw; }
  .wx-hours > div { flex: 1; text-align: center; }
  .wx-hours .h { font-size: 1.9vh; color: var(--muted); font-weight: 800; }
  .wx-hours svg { width: 4.6vh; height: 4.6vh; margin: .7vh auto; display: block; overflow: visible; }
  .wx-hours .t { font-family: 'Fredoka', sans-serif; font-size: 2.8vh; }
  .wx-hours .p { font-size: 1.7vh; color: #7cc4ff; font-weight: 800; min-height: 2.1vh; }
  .wx-days { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-around; padding: .6vh 1.4vw; }
  .wx-day { display: grid; grid-template-columns: 7.5vw 5vh 4.2vw 3.6vw 1fr 3.6vw; align-items: center; gap: 1vw; font-size: 2.6vh; font-weight: 800; }
  .wx-day svg { width: 4.6vh; height: 4.6vh; overflow: visible; }
  .wx-day .p { color: #7cc4ff; font-size: 2vh; }
  .wx-day .lo { color: var(--muted); text-align: right; }
  .wx-day .bar { height: .8vh; border-radius: .4vh; background: rgba(255,255,255,.08); position: relative; }
  .wx-day .bar i { position: absolute; top: 0; bottom: 0; border-radius: .4vh; background: linear-gradient(90deg, #7cc4ff, #ffc56b); }
  .wx-radar { display: flex; flex-direction: column; padding: 1.4vh; min-height: 0; }
  .wx-radar .img { flex: 1; min-height: 0; border-radius: 1.2vh; background: #0d1018 center / contain no-repeat; }
  .wx-radar .cap { font-size: 1.9vh; color: var(--muted); font-weight: 700; margin-top: 1vh; }

  /* scores: favorites on game days + top games */
  #v-sports .body { display: flex; flex-direction: column; gap: 2.2vh; }
  .sp-feat { display: grid; gap: 2vw; flex: none; }
  .sp-feat:empty, .sp-games:empty { display: none; }
  .fv { display: flex; align-items: center; gap: 1.6vw; padding: 2vh 1.8vw; border-left: .7vh solid var(--line); min-width: 0; }
  .fv > img { width: 9vh; height: 9vh; object-fit: contain; flex: none; }
  .fv .info { min-width: 0; flex: 1; }
  .fv .badge2 { display: inline-block; font-size: 1.7vh; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--warm); margin-bottom: .4vh; }
  .fv .badge2.live { color: #ff6b6b; }
  .fv .nm { font-family: 'Fredoka', sans-serif; font-size: 3.6vh; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fv .rec { font-size: 2vh; color: var(--muted); font-weight: 700; }
  .fv .mu { display: flex; align-items: center; gap: .6vw; font-size: 2.8vh; font-weight: 800; margin-top: .8vh; white-space: nowrap; overflow: hidden; }
  .fv .mu img { width: 3.8vh; height: 3.8vh; object-fit: contain; }
  .fv .mu .res { font-family: 'Fredoka', sans-serif; }
  .fv .mu .res.W { color: #5fd38d; } .fv .mu .res.L { color: #ff8a7a; }
  .fv .sub { font-size: 2.1vh; color: var(--muted); font-weight: 700; margin-top: .4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-h2 { font-size: 2.2vh; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; flex: none; margin-bottom: -.8vh; }
  /* Tile sizes are in em on a base of (k * 1vh): renderSports sets k from the number of games. */
  .sp-games { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.8vh 1.6vw; align-content: start; font-size: calc(var(--k, 1) * 1vh); }
  .sp-games.fill { grid-auto-rows: 1fr; align-content: stretch; }
  .gm { padding: 1.5em 1.3em; display: flex; flex-direction: column; justify-content: center; gap: .7em; min-width: 0; }
  .gm-top { display: flex; justify-content: space-between; align-items: center; font-size: 1.8em; font-weight: 800; color: var(--muted); }
  .gm-top .lg { letter-spacing: .08em; }
  .gm-top .st { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: .6em; }
  .gm-top .st.live { color: #ff6b6b; }
  .gm-top .st.live::before { content: ''; display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: #ff6b6b; margin-right: .3em; vertical-align: .08em; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .gm-t { display: flex; align-items: center; gap: .3em; font-size: 2.6em; font-weight: 800; }
  .gm-t img { width: 1.4em; height: 1.4em; object-fit: contain; flex: none; }
  .gm-t .rk { font-size: .65em; color: var(--muted); font-weight: 800; }
  .gm-t .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-t .sc { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 1.15em; font-variant-numeric: tabular-nums; }
  .gm-t .rc { font-size: .7em; color: var(--muted); font-weight: 700; }
  .gm.post .gm-t:not(.win) { color: var(--muted); }
  .sp-games.big .gm-note { white-space: normal; line-height: 1.25; }
  .gm-note { font-size: 1.7em; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-note.ser { color: var(--ink); opacity: .85; }
  .gm.fav { box-shadow: inset 0 0 0 2px rgba(255,197,107,.55); }

  /* fantasy */
  #v-fantasy .body { display: grid; grid-template-columns: 1.75fr 1fr; gap: 2.6vw; }
  .ff-list { display: grid; gap: 1.8vh; align-content: start; }
  .ff-list.two { grid-template-columns: 1fr 1fr; }
  .ff-match { padding: 1.2vh 1.4vw; }
  .ff-side { padding: .8vh 0; }
  .ff-side + .ff-side { border-top: 1px solid var(--line); }
  .ff-row { display: flex; align-items: center; gap: 1vw; }
  .ff-logo { width: 5.4vh; height: 5.4vh; border-radius: 50%; background: rgba(255,255,255,.08); flex: none; position: relative; overflow: hidden; }
  .ff-logo::before { content: attr(data-i); position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
    font: 600 1.9vh 'Fredoka', sans-serif; color: var(--muted); }
  .ff-logo img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #1e2330; }
  .ff-side .who { flex: 1; min-width: 0; }
  .ff-side .tn { font-family: 'Fredoka', sans-serif; font-size: 3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ff-side .ow { font-size: 1.9vh; color: var(--muted); font-weight: 700; }
  .ff-side .pts { text-align: right; }
  .ff-side .pts b { font-family: 'Fredoka', sans-serif; font-size: 4.4vh; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ff-side .pts small { display: block; font-size: 1.8vh; color: var(--muted); font-weight: 700; }
  .ff-side.lead .pts b, .ff-side.won .pts b { color: var(--warm); }
  .ff-side.lost .tn, .ff-side.lost .pts b { color: var(--muted); }
  .ff-tag { display: inline-block; font: 800 1.5vh 'Nunito', sans-serif; letter-spacing: .06em; padding: .2vh .6vw; border-radius: 99px; vertical-align: .5vh; margin-left: .5vw; }
  .ff-tag.w { background: #5fd38d; color: #0d2a19; }
  .ff-tag.hi { background: var(--warm); color: #3a2400; }
  .ff-perf { display: flex; gap: .7vw; margin: .7vh 0 .2vh 6.4vh; flex-wrap: nowrap; overflow: hidden; }
  .pf { display: flex; align-items: center; gap: .5vw; background: rgba(255,255,255,.05); border-radius: 99px; padding: .3vh .9vw .3vh .3vh; font-size: 1.9vh; font-weight: 700; white-space: nowrap; min-width: 0; }
  .pf .hs { width: 3.6vh; height: 3.6vh; border-radius: 50%; background: rgba(255,255,255,.08) center / cover no-repeat; flex: none; }
  .pf .pp { color: var(--muted); font-size: 1.5vh; }
  .pf b { color: var(--warm); font-family: 'Fredoka', sans-serif; font-weight: 600; }
  .ff-right { display: flex; flex-direction: column; gap: 1.8vh; align-self: start; }
  .ff-stand { padding: 2vh 1.6vw; }
  .ff-stand h2 { font-size: 2.4vh; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-bottom: 1.2vh; }
  .ff-stand table { width: 100%; border-collapse: collapse; font-size: 2.5vh; font-weight: 700; }
  .ff-stand td { padding: .9vh 0; border-top: 1px solid var(--line); white-space: nowrap; }
  .ff-stand td.n { color: var(--muted); width: 1.6em; padding-right: .8vw; }
  .ff-stand td.t { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .ff-stand td.r { text-align: right; padding-left: 1vw; font-variant-numeric: tabular-nums; }
  .ff-bench { display: flex; align-items: center; gap: 1.2vw; }
  .ff-bench .hs { width: 8vh; height: 8vh; border-radius: 50%; background: rgba(255,255,255,.08) center / cover no-repeat; flex: none; }
  .ff-bench .bn { font-family: 'Fredoka', sans-serif; font-size: 3vh; line-height: 1.1; }
  .ff-bench .bn b { color: var(--warm); font-weight: 600; }
  .ff-bench .bd { font-size: 1.9vh; color: var(--muted); font-weight: 700; margin-top: .4vh; line-height: 1.35; }
  .ff-bench .bd em { font-style: normal; color: #ff8a7a; }
  .ff-next div { font-size: 2.2vh; font-weight: 700; padding: .7vh 0; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ff-next div span { color: var(--muted); }

  /* today: national days + on this day */
  #v-today .body { display: grid; grid-template-columns: 1fr 1.3fr; gap: 2.6vw; align-items: center; }
  .td-big { display: flex; flex-direction: column; overflow: hidden; max-height: 100%; }
  .td-big .ph { height: 34vh; width: 100%; object-fit: contain; background: rgba(0,0,0,.25); flex: none; display: block; }
  .td-big .in { padding: 2.2vh 1.8vw 2.6vh; }
  .td-big .yr { font-family: 'Fredoka', sans-serif; font-size: 6.4vh; font-weight: 600; color: var(--warm); line-height: 1; }
  .td-big .yr small { font: 700 2.2vh 'Nunito', sans-serif; color: var(--muted); margin-left: 1vw; }
  .td-big .tx { font-size: 3vh; font-weight: 700; line-height: 1.3; margin-top: 1.2vh; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .td-days { padding: 2.4vh 1.8vw; display: flex; flex-direction: column; gap: 1.3vh; align-self: start; max-height: 100%; overflow: hidden; }
  .td-days h2, .td-hist h2 { font-size: 2.3vh; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-bottom: .4vh; }
  .td-day { font-family: 'Fredoka', sans-serif; font-weight: 500; line-height: 1.15; padding: .8vh 0 .8vh 1.2vw; border-left: .6vh solid var(--warm); }
  .td-day:nth-child(3n+2) { border-left-color: #7cc4ff; } .td-day:nth-child(3n) { border-left-color: #5fd38d; }
  .td-hist { display: flex; flex-direction: column; gap: 1.8vh; min-height: 0; }
  .td-ev { display: flex; gap: 1.4vw; padding: 1.8vh 1.4vw; align-items: center; min-height: 0; }
  .td-ev .yr { font-family: 'Fredoka', sans-serif; font-size: 5vh; font-weight: 600; color: var(--warm); line-height: 1; }
  .td-ev .ago { font-size: 1.8vh; color: var(--muted); font-weight: 700; margin-top: .4vh; }
  .td-ev .tx { font-size: 2.4vh; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin-top: .8vh; }
  .td-ev .th { width: 14vh; height: 14vh; border-radius: 1.2vh; background: rgba(255,255,255,.06) center / cover no-repeat; flex: none; }

  /* quotes (same frame as photos) */
  #v-quotes { padding: 0; background: #000; }
  #v-quotes .blur { position: absolute; top: -40px; right: -40px; bottom: -40px; left: -40px; background-size: cover; background-position: center; filter: blur(32px) brightness(.45); }
  #v-quotes img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

  /* gratitude */
  #v-gratitude .body { display: flex; align-items: center; justify-content: center; }
  .gr-card { max-width: 78vw; padding: 6vh 5vw; text-align: center; position: relative; background: linear-gradient(160deg, rgba(255,197,107,.12), rgba(255,255,255,.03)); }
  .gr-card .mark { font-family: Georgia, serif; font-size: 16vh; line-height: .6; color: var(--warm); opacity: .55; height: 7vh; }
  .gr-card .txt { font-family: 'Fredoka', sans-serif; font-weight: 500; line-height: 1.25; }
  .gr-card .by { margin-top: 3.4vh; font-size: 2.8vh; color: var(--muted); font-weight: 800; }
  .gr-card .by b { color: var(--ink); }

  /* footer dots */
  .dots { position: absolute; bottom: 2.4vh; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 5; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); transition: background .4s, width .4s; }
  .dots i.on { background: rgba(255,255,255,.85); width: 26px; border-radius: 5px; }
  .dots.hold i.on { background: var(--warm); }
  .status { position: absolute; bottom: 2.2vh; left: 2vw; font-size: 1.8vh; color: #ff8a7a; z-index: 5; }

  /* setup */
  #setup { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center; background: var(--bg); z-index: 20; cursor: auto; }
  #setup form { width: min(560px, 90vw); display: grid; gap: 14px; }
  #setup h1 { font-size: 34px; }
  #setup p { color: var(--muted); line-height: 1.5; }
  #setup input { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }
  #setup button { font: inherit; font-weight: 800; font-size: 17px; padding: 13px; border-radius: 10px; border: 0; background: var(--warm); color: #2b1a00; }
  #setup a { color: var(--warm); }
</style>
</head>

<div id="setup">
  <form id="setupForm">

    <p>Open the <b>Display link</b> from the controller's settings on this tablet, or paste the backend details here.</p>
    <input id="sApi" placeholder="Apps Script web app URL (…/exec)" autocomplete="off">

    <button type="submit">Save</button>
    <p>Just looking? <a href="?demo=1">Run the demo</a>.</p>
  </form>
</div>

<script src="js/espn.js"></script>
<script src="js/api.js"></script>
<script src="js/jar.js"></script>
<script>
(function () {
  'use strict';
  var F = window.FamDash;

  /* ---------- setup ---------- */
  if (!F.config) {
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('setupForm').onsubmit = function (e) {
      e.preventDefault();
      F.saveConfig(document.getElementById('sApi').value.trim(), document.getElementById('sTok').value.trim());
      location.reload();
    };
    return;
  }

  var state = null, events = [];
  var wxData = null, scoresData = null, fantasyData = null, notes = [];
  var todayData = null;           // {date, days: [...], events: [...]}
  var DEFAULT_SCORE_LEAGUES = ['football/college-football', 'football/nfl', 'basketball/nba', 'baseball/mlb'];
  var shownCounts = {};           // marble counts last drawn on the jar view
  var views = ['calendar', 'jars', 'photo', 'lunch', 'weather', 'sports', 'fantasy', 'quotes', 'gratitude', 'today'];
  var lunch = null;               // {url, name} once the image has actually loaded
  var lunchImg = null;
  var current = null, idx = -1, timer = null, holding = false;

  function $(id) { return document.getElementById(id); }
  function setStatus(msg) { $('status').textContent = msg || ''; }

  /* ---------- clock ---------- */
  function tick() {
    var n = new Date();
    $('clockT').textContent = n.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('clockD').textContent = n.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 10000);

  // New day -> reload once it's past 3am. Checked on every clock tick rather than with one long timer,
  // because Android freezes timers while the tablet sleeps and a 3am setTimeout can silently never fire.
  var bootDay = (function () { var d = new Date(); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); })();
  setInterval(function () {
    var d = new Date(), k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (k !== bootDay && d.getHours() >= 3) location.reload();
  }, 30000);
  document.addEventListener('visibilitychange', function () {
    var d = new Date(), k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (!document.hidden && k !== bootDay && d.getHours() >= 3) location.reload();
  });

  /* ---------- data ---------- */
  function loadState() {
    return F.get('state').then(function (r) {
      state = r.state;
      views = (state.settings.views || views).slice();
      setStatus('');
      if (current === 'jars') renderJars();
      drawDots();
    }).catch(function (e) { setStatus('⚠ ' + e.message); });
  }
  function loadEvents() {
    return F.get('events').then(function (r) {
      events = r.events; if (current === 'calendar') renderCalendar();
    }).catch(function (e) { setStatus('⚠ calendar: ' + e.message); });
  }
  function loadSports() {
    if (!state) return Promise.resolve();
    var st = state.settings;
    var leagues = Array.isArray(st.scoreLeagues) ? st.scoreLeagues : DEFAULT_SCORE_LEAGUES;
    return F.scores(leagues, st.sportsTeams || []).then(function (r) {
      // An empty result right after a good one is usually an ESPN hiccup: keep what we had.
      var empty = !(r.games || []).length && !(r.featured || []).length;
      if (!empty || !scoresData || Date.now() - scoresData.at > 30 * 60000) scoresData = { games: r.games || [], featured: r.featured || [], at: Date.now() };
      if (current === 'sports') renderSports();
    }).catch(function (e) { setStatus('⚠ scores: ' + e.message); });
  }
  function loadFantasy() {
    if (!state) return Promise.resolve();
    return F.fantasy(state.settings.fantasyLeagueId).then(function (r) {
      fantasyData = r; if (current === 'fantasy') renderFantasy();
    }).catch(function (e) { setStatus('⚠ fantasy: ' + e.message); });
  }
  function loadNotes() {
    return F.get('gratitude').then(function (r) { notes = r.notes || []; })
      .catch(function (e) { setStatus('⚠ gratitude: ' + e.message); });
  }

  // The menu image is shown as a plain (non-CORS) image so it always loads. The whitespace
  // trim needs pixel access, which needs CORS; the host's CDN sometimes serves a cached copy
  // without the CORS header, so the trim box is measured from a separate cache-busted CORS
  // request and remembered per image URL. If that ever fails, the remembered box (or no trim)
  // is used — the menu itself never depends on it.
  var BOXKEY = 'famdash.lunchBox';
  function savedBox(url) {
    try { var b = JSON.parse(localStorage.getItem(BOXKEY) || 'null'); return b && b.url === url ? b.box : null; } catch (e) { return null; }
  }
  function loadImg(src, cors) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      if (cors) im.crossOrigin = 'anonymous';
      im.onload = function () { resolve(im); };
      im.onerror = function () { reject(new Error('image load failed')); };
      im.src = src;
    });
  }
  var GRIDKEY = 'famdash.lunchGrid';
  function savedGrid(url) {
    try { var g = JSON.parse(localStorage.getItem(GRIDKEY) || 'null'); return g && g.url === url ? g.grid : undefined; } catch (e) { return undefined; }
  }
  // One CORS read of the image gives both the whitespace trim box and the calendar grid.
  function measureBox(url, name) {
    var bust = url.indexOf('data:') === 0 ? url : url + (url.indexOf('?') >= 0 ? '&' : '?') + 'famdash=trim';
    return loadImg(bust, true).then(function (im) {
      var box = findBox(im), grid = null;
      try { grid = findGrid(im, name); } catch (e) { grid = null; }
      try {
        if (box) localStorage.setItem(BOXKEY, JSON.stringify({ url: url, box: box }));
        localStorage.setItem(GRIDKEY, JSON.stringify({ url: url, grid: grid }));
      } catch (e) {}
      return { box: box, grid: grid };
    }).catch(function () { return { box: null, grid: null }; });
  }

  var MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  // Which month the flyer is for: from the file name ("October lunch.png"), else this month.
  function flyerMonth(name) {
    var now = new Date(), m = now.getMonth(), y = now.getFullYear();
    var low = String(name || '').toLowerCase();
    for (var i = 0; i < 12; i++) if (low.indexOf(MONTHS[i]) >= 0 || low.indexOf(MONTHS[i].slice(0, 3) + ' ') >= 0) { m = i; break; }
    if (m - now.getMonth() > 6) y--; else if (now.getMonth() - m > 6) y++;
    return { m: m, y: y };
  }
  // School weeks of a month as [[Date|null x5]] (Mon..Fri), one entry per week with a school day.
  function monthWeeks(y, m) {
    var weeks = [], cur = null, d = new Date(y, m, 1);
    while (d.getMonth() === m) {
      var wd = d.getDay();
      if (wd >= 1 && wd <= 5) {
        if (!cur || wd === 1) { cur = [null, null, null, null, null]; weeks.push(cur); }
        cur[wd - 1] = new Date(d);
      }
      d.setDate(d.getDate() + 1);
    }
    return weeks;
  }

  // Find the calendar's ruled grid: long dark horizontal/vertical lines. Returns {xs, ys, header, wdCol0, y, m}
  // or null when the flyer doesn't look like a Mon–Fri (or Sun–Sat) grid matching its month.
  function findGrid(im, name) {
    var W = im.naturalWidth, H = im.naturalHeight;
    // Full resolution: downscaling blurs 1px rules into grey and they stop registering as lines.
    var s = Math.min(1, 2400 / Math.max(W, H));
    var w = Math.round(W * s), h = Math.round(H * s);
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d'); x.drawImage(im, 0, 0, w, h);
    var d = x.getImageData(0, 0, w, h).data;
    var dark = new Uint8Array(w * h);
    for (var i = 0, k = 0; i < w * h; i++, k += 4) dark[i] = (d[k] < 120 && d[k + 1] < 120 && d[k + 2] < 120) ? 1 : 0;
    function lines(len, span, at, minRun) {
      var hits = [];
      for (var a = 0; a < len; a++) {
        var best = 0, run = 0;
        for (var b = 0; b < span; b++) { if (dark[at(a, b)]) { run++; if (run > best) best = run; } else run = 0; }
        if (best >= minRun) hits.push(a);
      }
      var out = [];
      hits.forEach(function (v) { if (out.length && v - out[out.length - 1][1] <= 4) out[out.length - 1][1] = v; else out.push([v, v]); });
      return out.map(function (g) { return Math.round((g[0] + g[1]) / 2 / s); });
    }
    var ys = lines(h, w, function (a, b) { return a * w + b; }, w * 0.4);
    var xs = lines(w, h, function (a, b) { return b * w + a; }, h * 0.3);
    var fm = flyerMonth(name), weeks = monthWeeks(fm.y, fm.m);
    var wdCol0;
    if (xs.length === 6) wdCol0 = 0;          // Mon..Fri columns
    else if (xs.length === 8) wdCol0 = 1;     // Sun..Sat: Monday is the 2nd column
    else return null;
    var bands = ys.length - 1, header;
    if (bands === weeks.length + 1) header = true;
    else if (bands === weeks.length) header = false;
    else return null;
    return { xs: xs, ys: ys, header: header, wdCol0: wdCol0, y: fm.y, m: fm.m, W: W, H: H, extras: findExtras(dark, w, h, s, xs, ys) };
  }
  // "Additional daily options" text under the grid's left half, as a trimmed rect (or null).
  // Keeps the heading plus its indented list and drops the fine print that follows.
  function findExtras(dark, w, h, s, xs, ys) {
    var x0 = Math.round(xs[0] * s), x1 = Math.round(xs[Math.min(3, xs.length - 1)] * s);
    var y0 = Math.round(ys[ys.length - 1] * s) + Math.max(6, Math.round(6 * s));
    // text lines = runs of rows containing ink; record each line's extent
    var lines = [], cur = null;
    for (var yy = y0; yy < h; yy++) {
      var lo = -1, hi = -1;
      for (var xx = x0; xx < x1; xx++) if (dark[yy * w + xx]) { if (lo < 0) lo = xx; hi = xx; }
      if (lo >= 0) {
        if (!cur) { cur = { y0: yy, y1: yy, lo: lo, hi: hi }; lines.push(cur); }
        else { cur.y1 = yy; if (lo < cur.lo) cur.lo = lo; if (hi > cur.hi) cur.hi = hi; }
      } else cur = null;
    }
    lines = lines.filter(function (l) { return l.y1 - l.y0 >= 3; });      // drop specks and rules
    if (!lines.length) return null;
    var left = Math.min.apply(null, lines.map(function (l) { return l.lo; }));
    var keep = [lines[0]];
    var indentStep = 12 * s;
    for (var i = 1; i < lines.length; i++) {
      if (lines[i].lo - left < indentStep && keep.length > 1) break;      // back at the margin after a list: fine print
      keep.push(lines[i]);
    }
    if (keep.length < 2) keep = lines;
    var minX = Math.min.apply(null, keep.map(function (l) { return l.lo; })), maxX = Math.max.apply(null, keep.map(function (l) { return l.hi; }));
    var minY = keep[0].y0, maxY = keep[keep.length - 1].y1;
    if (maxY - minY < 20 * s) return null;
    var pad = 8, top = Math.max(y0, minY - pad);   // never reach back up into the grid's bottom rule
    return { x: Math.max(0, Math.round((minX - pad) / s)), y: Math.round(top / s),
             w: Math.round((maxX - minX + 2 * pad) / s), h: Math.round((maxY + pad - top) / s) };
  }

  // The week to show: this week, or next week on Sat/Sun. Returns {idx, days} in the flyer's month, or null.
  function pickWeek(grid) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    if (t.getDay() === 6) t.setDate(t.getDate() + 2); else if (t.getDay() === 0) t.setDate(t.getDate() + 1);
    var weeks = monthWeeks(grid.y, grid.m);
    for (var i = 0; i < weeks.length; i++) {
      if (weeks[i].some(function (d) { return d && d.getTime() === t.getTime(); })) return { idx: i, days: weeks[i], target: t };
    }
    return null;
  }

  function cropCanvas(im, r) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, r.w); c.height = Math.max(1, r.h);
    c.getContext('2d').drawImage(im, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);   // tainted is fine: display only
    return c;
  }

  function renderLunchWeek(im, grid, wk) {
    var band = wk.idx + (grid.header ? 1 : 0);
    var y0 = grid.ys[band], y1 = grid.ys[band + 1];
    var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var html = [], canv = [];
    for (var i = 0; i < 5; i++) {
      var d = wk.days[i];
      if (!d) continue;                       // partial first/last week: only the month's school days
      var cx0 = grid.xs[grid.wdCol0 + i], cx1 = grid.xs[grid.wdCol0 + i + 1];
      var inset = 4;
      canv.push(d ? cropCanvas(im, { x: cx0 + inset, y: y0 + inset, w: cx1 - cx0 - 2 * inset, h: y1 - y0 - 2 * inset }) : null);
      var cls = d && d.getTime() === today.getTime() ? ' today' : (d && d < today ? ' past' : '');
      html.push('<div class="lw-cell' + cls + '"><div class="lbl">' + DAYS[i] +
        '<small>' + (d ? d.toLocaleDateString([], { month: 'short', day: 'numeric' }) : '') + '</small></div><div class="img"></div></div>');
    }
    if (grid.extras) html.push('<div class="lw-cell"><div class="lbl">Every day<small>options</small></div><div class="img"></div></div>');
    var box = $('lunchWeek');
    box.innerHTML = html.join('');
    var imgs = box.querySelectorAll('.img');
    canv = canv.filter(Boolean);
    canv.forEach(function (c, i) { imgs[i].appendChild(c); });
    if (grid.extras) imgs[canv.length].appendChild(cropCanvas(im, grid.extras));
    // full week: Mon–Wed over Thu–Fri + options; short weeks get one row (or 2x2) so cells stay big
    var n = html.length;
    box.style.gridTemplateColumns = 'repeat(' + (n <= 3 ? n : n === 4 ? 2 : 3) + ', 1fr)';
    box.style.gridTemplateRows = n <= 3 ? '62%' : '1fr 1fr';
    box.style.alignContent = n <= 3 ? 'center' : '';
    var monday = wk.days.filter(Boolean)[0];
    $('lunchTitle').innerHTML = 'Lunch <span>· week of ' + monday.toLocaleDateString([], { month: 'long', day: 'numeric' }) + '</span>';
    box.style.display = ''; $('lunchWrap').style.display = 'none';
  }
  function showLunch(im, r, box, grid) {
    var wk = grid ? pickWeek(grid) : null;
    if (grid && wk) { renderLunchWeek(im, grid, wk); return; }
    $('lunchTitle').innerHTML = 'Lunch <span>menu</span>';
    $('lunchWeek').style.display = 'none'; $('lunchWrap').style.display = '';
    renderLunch(im, box);
  }
  function renderLunch(im, box) {
    var el = document.createElement('canvas');
    var X = 0, Y = 0, W = im.naturalWidth, H = im.naturalHeight;
    if (box) { X = box.x; Y = box.y; W = box.w; H = box.h; }
    el.width = W; el.height = H;
    el.getContext('2d').drawImage(im, X, Y, W, H, 0, 0, W, H);   // tainted canvas is fine for display
    el.setAttribute('aria-label', 'School lunch calendar');
    $('lunchCard').innerHTML = '';
    $('lunchCard').appendChild(el);
    fitLunch();
  }

  function loadLunch() {
    return F.get('lunch').then(function (r) {
      if (!r.url) { lunch = null; lunchImg = null; return; }   // no lunch page set up: view is skipped
      if (lunch && lunch.url === r.url) return;
      return loadImg(r.url, false).then(function (im) {
        lunch = r; lunchImg = im;
        var box = savedBox(r.url), grid = savedGrid(r.url);
        showLunch(im, r, box, grid);
        if (!box || grid === undefined) measureBox(r.url, r.name).then(function (m) {
          if (lunch === r) showLunch(im, r, m.box, m.grid);
        });
      }, function () {
        if (!lunch) setStatus('⚠ lunch image did not load: ' + r.url.split('/').pop());
      });
    }).catch(function (e) { if (!lunch) setStatus('⚠ lunch: ' + e.message); });
  }

  // Bounding box of the non-white content, in full-resolution pixels; null if unreadable/implausible.
  function findBox(im) {
    var W = im.naturalWidth, H = im.naturalHeight;
    try {
      var s = Math.min(1, 700 / Math.max(W, H));
      var sw = Math.max(1, Math.round(W * s)), sh = Math.max(1, Math.round(H * s));
      var c = document.createElement('canvas'); c.width = sw; c.height = sh;
      var x = c.getContext('2d'); x.drawImage(im, 0, 0, sw, sh);
      var d = x.getImageData(0, 0, sw, sh).data;
      var cols = new Array(sw), rows = new Array(sh), i, j;
      for (i = 0; i < sw; i++) cols[i] = 0;
      for (j = 0; j < sh; j++) rows[j] = 0;
      for (j = 0; j < sh; j++) for (i = 0; i < sw; i++) {
        var k = (j * sw + i) * 4;
        if (d[k + 3] > 40 && (d[k] < 232 || d[k + 1] < 232 || d[k + 2] < 232)) { cols[i]++; rows[j]++; }
      }
      var minC = Math.max(2, sh * 0.004), minR = Math.max(2, sw * 0.004);
      var x0 = 0, x1 = sw - 1, y0 = 0, y1 = sh - 1;
      while (x0 < x1 && cols[x0] < minC) x0++;
      while (x1 > x0 && cols[x1] < minC) x1--;
      while (y0 < y1 && rows[y0] < minR) y0++;
      while (y1 > y0 && rows[y1] < minR) y1--;
      var pad = Math.round(Math.max(sw, sh) * 0.012);

        var pg = (e.pages || []).filter(function (p) { return p.thumbnail && p.thumbnail.source; })[0];
        var img = pg ? pg.thumbnail.source.replace(/\/(\d+)px-/, '/640px-') : '';
        return { year: e.year, text: e.text, img: img, small: pg ? pg.thumbnail.source : '', sel: !!sel };
      });
    }
    // The backend says which day its list is for. Only a list dated today counts as final; an older
    // backend (no date) is shown but re-checked every 30 minutes; a list for another day is dropped.
    var iso = d.getFullYear() + '-' + mm + '-' + dd;
    var daysOk = false;
    var days = F.get('today').then(function (r) {
      if (r.date === iso) { daysOk = true; return r.days || []; }
      if (r.date === undefined) return r.days || [];
      return [];
    }).catch(function () { return null; });
    return Promise.all([days, wiki('selected')]).then(function (r) {
      var events = safe(r[1].selected, true);
      var more = events.length >= 4 ? Promise.resolve([]) : wiki('events').then(function (j) { return safe(j.events); });
      return more.then(function (m) {
        var seen = {};
        events = events.concat(m).filter(function (e) { var k = e.year + e.text.slice(0, 30); if (seen[k]) return false; seen[k] = 1; return true; });
        // "National ___ Day" first, then the rest
        var dl = (r[0] || []).slice().sort(function (a, b) { return (/^National /.test(b) ? 1 : 0) - (/^National /.test(a) ? 1 : 0); });
        todayData = { date: key, days: dl, events: events, complete: daysOk && events.length > 0 };
        try { localStorage.setItem('famdash.today2', JSON.stringify(todayData)); localStorage.removeItem('famdash.today'); } catch (e) {}
        if (current === 'today') renderToday();
      });
    });
  }
  var TKEY = 'famdash.todayIdx';
  function renderToday(advance) {
    var t = todayData; if (!t) return;
    var days = t.days.slice(0, 4);
    var size = days.length <= 3 ? 5 : 4.4;
    $('tdDays').innerHTML = '<h2>Today is…</h2>' + (days.length ? days.map(function (d) {
      return '<div class="td-day" style="font-size:' + size + 'vh">' + esc(d) + '</div>';
    }).join('') : '<div class="td-day" style="font-size:4vh">' + new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) + '</div>');
    $('tdTitle').innerHTML = 'Happy <span>' + new Date().toLocaleDateString([], { weekday: 'long' }) + '</span>';
    // one big event per visit, preferring ones with a picture, rotating through the day's list
    // Wikipedia's curated picks first; fall back to the broader list only when they run short.
    var ev = t.events.filter(function (e) { return e.img && e.sel; });
    if (ev.length < 2) ev = ev.concat(t.events.filter(function (e) { return e.img && !e.sel; }));
    if (!ev.length) ev = t.events;
    var i = 0;
    try { i = Number(localStorage.getItem(TKEY) || 0) || 0; } catch (e) {}
    if (advance) { i = (i + 1) % Math.max(1, ev.length); try { localStorage.setItem(TKEY, String(i)); } catch (e) {} }
    var e = ev[i % Math.max(1, ev.length)];
    $('tdHist').innerHTML = e ? '<div class="td-big card">' + (e.img ? '<img class="ph" alt="" src="' + esc(e.img) + '"' +
      (e.small ? ' onerror="if(this.src!==\'' + esc(e.small) + '\')this.src=\'' + esc(e.small) + '\';else this.remove()"' : ' onerror="this.remove()"') + '>' : '') +
      '<div class="in"><div class="yr">' + esc(e.year) + '<small>' + (new Date().getFullYear() - e.year) + ' years ago</small></div>' +
      '<div class="tx">' + esc(e.text) + '</div></div></div>' : '';
  }

  /* ---------- gratitude ---------- */
  var GKEY = 'famdash.lastNote';
  function showNote() {
    if (!notes.length) return false;
    var last = null; try { last = localStorage.getItem(GKEY); } catch (e) {}
    var i = -1; notes.forEach(function (n, j) { if (n.id === last) i = j; });
    var n = notes[(i + 1) % notes.length];
    try { localStorage.setItem(GKEY, n.id); } catch (e) {}
    var len = n.text.length, size = len < 60 ? 7 : len < 120 ? 5.6 : len < 220 ? 4.4 : 3.6;
    $('grCard').innerHTML = '<div class="mark">“</div><div class="txt" style="font-size:' + size + 'vh">' + esc(n.text) + '</div>' +
      '<div class="by">' + (n.who ? '— <b>' + esc(n.who) + '</b> · ' : '') + new Date(n.created).toLocaleDateString([], { month: 'short', day: 'numeric' }) + '</div>';
    return true;
  }

  /* ---------- calendar ---------- */
  function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel(d) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var x = new Date(d); x.setHours(0, 0, 0, 0);
    var diff = Math.round((x - t) / 86400000);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff < 7) return x.toLocaleDateString([], { weekday: 'long' });
    return x.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function renderCalendar() {
    var box = $('agenda');
    if (!events.length) { box.innerHTML = '<div class="empty">Nothing on the calendar. Enjoy it.</div>'; return; }
    var now = new Date(), groups = [], byKey = {};
    events.forEach(function (ev) {
      var s = new Date(ev.start), e = new Date(ev.end);
      var anchor = s < now ? now : s;           // ongoing / multi-day events land on today
      var k = dayKey(anchor);
      if (!byKey[k]) { byKey[k] = { date: anchor, items: [] }; groups.push(byKey[k]); }
      byKey[k].items.push({ ev: ev, s: s, e: e, now: s <= now && e > now });
    });
    box.innerHTML = groups.map(function (g) {
      var label = dayLabel(g.date);
      return '<div class="day' + (label === 'Today' ? ' today' : '') + '"><h2>' + label + '</h2>' +
        g.items.map(function (it) {
          var ev = it.ev, when;
          if (ev.allDay) when = '<div class="when all">All day</div>';
          else if (it.now) when = '<div class="when">Now</div>';
          else when = '<div class="when">' + it.s.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</div>';
          var sub = [shortPlace(ev.location), ev.calendar].filter(Boolean).map(esc).join(' · ');
          return '<div class="ev' + (it.now ? ' now' : '') + '">' + when +
            '<div class="bar" style="background:' + esc(ev.color || '#888') + '"></div>' +
            '<div><div class="what">' + esc(ev.title || '(busy)') + '</div>' +
            (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div></div>';
        }).join('') + '</div>';
    }).join('');
    fitAgenda();
  }

  // "1311 S Logan St, Mishawaka, IN 46544, United States" -> "1311 S Logan St"
  // "Bittersweet Park, 123 Main St, Granger" -> "Bittersweet Park"
  function shortPlace(loc) {
    if (!loc) return '';
    return String(loc).split(/\n|,/)[0].trim();
  }

  // Drop events from the end until everything fits in the two columns, then say how many were cut.
  function fitAgenda() {
    var box = $('agenda');
    if (!box.clientHeight) return;            // not laid out yet
    function over() { return box.scrollWidth > box.clientWidth + 2; }
    if (!over()) return;
    var hidden = 0, more = null;
    while (over()) {
      var evs = box.querySelectorAll('.ev');
      if (evs.length <= 1) break;
      var last = evs[evs.length - 1], day = last.parentNode;
      day.removeChild(last); hidden++;
      if (!day.querySelector('.ev')) day.parentNode.removeChild(day);
      if (!more) { more = document.createElement('div'); more.className = 'more'; box.appendChild(more); }
      more.textContent = '+ ' + hidden + ' more on the calendar';
      box.appendChild(more);
    }
  }
  window.addEventListener('resize', function () { if (current === 'calendar') renderCalendar(); });

  /* ---------- jars ---------- */
  function renderJars() {
    if (!state) return;
    var root = $('v-jars');
    // build skeleton once per kid set
    var st = state.settings;
    var jars = state.kids;
    if (st.jarMode === 'combined') {
      // one shared jar: total of everyone's marbles, no per-kid breakdown on screen
      var total = 0; state.kids.forEach(function (k) { total += k.count; });
      jars = [{ id: 'family', name: st.jarTitle || 'Family jar', count: total, goal: st.jarGoal || 100, color: '#ffc56b' }];
    }
    var sig = jars.map(function (k) { return k.id; }).join(',');
    if (root.getAttribute('data-sig') !== sig) {
      root.setAttribute('data-sig', sig);
      ['n1', 'n2', 'n3', 'n4'].forEach(function (c) { root.classList.toggle(c, c === 'n' + jars.length); });
      root.innerHTML = jars.map(function (k) {
        return '<div class="kid' + (jars.length === 1 ? ' solo' : '') + '" id="kid-' + k.id + '"><div class="name"></div><div class="jar"></div><div class="count"></div></div>';
      }).join('');
    }
    jars.forEach(function (k) {
      var box = $('kid-' + k.id);
      var prev = shownCounts[k.id];
      var jarBox = box.querySelector('.jar');
      var drawn = jarBox.getAttribute('data-drawn');
      var sigK = k.count + '/' + k.goal;
      var res = { overflow: Number(jarBox.getAttribute('data-over') || 0) };
      if (drawn !== sigK) {   // redraw only on change, so an in-flight drop animation isn't restarted
        res = Jar.render(jarBox, k, prev === undefined ? null : prev);
        jarBox.setAttribute('data-drawn', sigK);
        jarBox.setAttribute('data-over', res.overflow);
      }
      shownCounts[k.id] = k.count;
      var done = k.count >= k.goal;
      box.querySelector('.name').innerHTML = '<span style="color:' + esc(k.color) + '">' + esc(k.name) + '</span>' +
        (done ? '<span class="badge">Goal!</span>' : '');
      box.querySelector('.count').innerHTML = '<b>' + k.count + '</b> of ' + k.goal +
        (res.overflow ? ' <span style="color:var(--warm)">(+' + res.overflow + ' extra)</span>' : '');
    });
  }

  /* ---------- photo & quote albums (Drive folders; one image per visit, in order, wrapping) ---------- */
  function Album(kind, imgId, blurId, key) {
    this.kind = kind; this.imgId = imgId; this.blurId = blurId; this.key = key;
    this.list = []; this.listAt = 0; this.pre = null;
  }
  Album.prototype.loadList = function () {
    var a = this;
    return F.get('photos', { kind: a.kind }).then(function (r) { a.list = r.photos; a.listAt = Date.now(); })
      .catch(function (e) { setStatus('⚠ ' + a.kind + ': ' + e.message); });
  };
  Album.prototype.nextId = function () {
    if (!this.list.length) return null;
    var last = null; try { last = localStorage.getItem(this.key); } catch (e) {}
    var i = -1;
    this.list.forEach(function (p, j) { if (p.id === last) i = j; });
    return this.list[(i + 1) % this.list.length].id;
  };
  Album.prototype.preload = function () {
    var a = this, id = a.nextId();
    if (!id) { a.pre = null; return Promise.resolve(); }
    if (a.pre && a.pre.id === id) return Promise.resolve();
    return F.get('photo', { id: id }).then(function (r) {
      var url = r.url || ('data:' + r.mime + ';base64,' + r.data);
      if (r.url) { var warm = new Image(); warm.src = r.url; }   // demo photos are plain URLs: warm the cache
      a.pre = { id: id, url: url };
    }).catch(function (e) { setStatus('⚠ ' + a.kind + ': ' + e.message); a.pre = null; });
  };
  Album.prototype.ensure = function () {
    var a = this;
    if (a.pre) return Promise.resolve();
    return (a.list.length ? a.preload() : a.loadList().then(function () { return a.preload(); }));
  };
  Album.prototype.show = function () {
    var a = this, p = a.pre;
    if (!p) return false;
    $(a.imgId).src = p.url;
    $(a.blurId).style.backgroundImage = 'url("' + p.url + '")';
    try { localStorage.setItem(a.key, p.id); } catch (e) {}
    a.pre = null;
    // fetch the next one in the background, refreshing the folder list now and then
    setTimeout(function () {
      (Date.now() - a.listAt > 15 * 60000 ? a.loadList() : Promise.resolve()).then(function () { return a.preload(); });
    }, 3000);
    return true;
  };
  var albums = {
    photo: new Album('photos', 'photoImg', 'photoBlur', 'famdash.lastPhoto'),
    quotes: new Album('quotes', 'quoteImg', 'quoteBlur', 'famdash.lastQuote')
  };

  /* ---------- view cycling ---------- */
  function drawDots() {
    $('dots').innerHTML = views.map(function (v) { return '<i class="' + (v === current ? 'on' : '') + '"></i>'; }).join('');
    $('dots').className = 'dots' + (holding ? ' hold' : '');
  }

  function show(view) {
    if ((view === 'photo' || view === 'quotes') && !albums[view].show()) return false;
    if (view === 'lunch' && !lunch) return false;
    if (view === 'weather' && !wxData) return false;
    if (view === 'sports' && !(scoresData && (scoresData.games.length || scoresData.featured.length))) return false;
    if (view === 'fantasy' && !(fantasyData && fantasyData.league && fantasyData.matchups && fantasyData.matchups.length)) return false;
    if (view === 'gratitude' && !showNote()) return false;
    if (view === 'today' && !(todayData && (todayData.days.length || todayData.events.length))) return false;
    // never show yesterday's page: refresh in the background and catch it on the next cycle
    if (view === 'today' && todayData.date !== todayKey()) { loadToday(); return false; }
    if (view === 'today') renderToday(true);
    if (view === 'calendar') renderCalendar();
    if (view === 'jars') renderJars();
    var sections = document.querySelectorAll('.view');
    for (var i = 0; i < sections.length; i++) sections[i].classList.toggle('on', sections[i].id === 'v-' + view);
    document.body.classList.toggle('photo-on', view === 'photo');
    document.body.classList.toggle('lunch-on', view === 'lunch');
    document.body.classList.toggle('quotes-on', view === 'quotes');
    if (view === 'lunch') {
      var g = lunch && savedGrid(lunch.url);
      if (lunchImg) showLunch(lunchImg, lunch, savedBox(lunch.url), g || null);
      fitLunch();
    }
    current = view;
    // render after the section is visible so layout-dependent views measure correctly
    if (view === 'weather') renderWeather();
    if (view === 'sports') renderSports();
    if (view === 'fantasy') renderFantasy();
    drawDots();
    return true;
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(function () { holding = false; next(); }, ms);
  }

  function next() {
    var secs = (state && state.settings.viewSeconds) || 20;
    for (var tries = 0; tries < views.length; tries++) {
      idx = (idx + 1) % views.length;
      if (show(views[idx])) { schedule(secs * 1000); return; }
    }
    schedule(5000); // nothing showable yet (e.g. only photos, none loaded)
  }

  function jump(view, holdSecs) {
    var i = views.indexOf(view);
    if (i >= 0) idx = i;
    holding = true;
    var go = function () { show(view); schedule(holdSecs * 1000); };
    if (albums[view]) albums[view].ensure().then(go);
    else if (view === 'gratitude' && !notes.length) loadNotes().then(go);
    else go();
  }

  /* ---------- relay ---------- */
  // Tell the controller this display has applied a change (it shows "Display updated ✓").
  function ack(msg) { if (msg && msg.id && state) F.poke(state.ntfyTopic, { type: 'ack', id: msg.id }); }

  function onMessage(msg) {
    var hold = (state && state.settings.holdSeconds) || 30;
    if (msg.type === 'ack') return;
    if (msg.type === 'show') { jump(msg.view, msg.hold || hold); ack(msg); }
    else if (msg.type === 'jar') loadState().then(function () { jump('jars', Math.min(hold, 20)); });
    else if (msg.type === 'refresh') {
      Promise.all([loadEvents(), loadLunch(), loadState().then(function () {
        // re-render what's on screen with the new settings (photos/notes keep their place)
        if (current === 'calendar') renderCalendar();
        if (current === 'jars') renderJars();
        return Promise.all([loadSports(), loadFantasy(), loadWeather()]);
      })]).then(function () { ack(msg); });
    }
    else if (msg.type === 'photos') {
      var kinds = msg.kind ? [msg.kind === 'quotes' ? 'quotes' : 'photo'] : ['photo', 'quotes'];
      kinds.forEach(function (k) { var a = albums[k]; a.loadList().then(function () { a.pre = null; return a.preload(); }); });
    }
    else if (msg.type === 'gratitude') loadNotes().then(function () {
      // a note was just added: show it now (list is newest-first, so point "last shown" at the end)
      if (notes.length) try { localStorage.setItem(GKEY, notes[notes.length - 1].id); } catch (e) {}
      jump('gratitude', hold);
      ack(msg);
    });
    else if (msg.type === 'reload') location.reload();
  }

  /* ---------- keep awake (newer browsers only; use a kiosk app on old tablets) ---------- */
  function wake() {
    if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });
  wake();

  // nightly reload around 3am keeps an old tablet's memory in check and picks up new versions
  (function () {
    var n = new Date(), t = new Date(n); t.setHours(3, 0, 0, 0);
    if (t <= n) t.setDate(t.getDate() + 1);
    setTimeout(function () { location.reload(); }, t - n);
  })();

  /* ---------- boot ---------- */
  Promise.all([loadState().then(function () { return Promise.all([loadSports(), loadFantasy()]); }),
    loadEvents(), albums.photo.loadList(), albums.quotes.loadList(), loadLunch(), loadNotes(), loadToday()]).then(function () {
    return loadWeather();
  }).then(function () {
    if (state) {
      state.kids.forEach(function (k) { shownCounts[k.id] = k.count; });
      F.listen(state.ntfyTopic, onMessage);
    }
    albums.photo.preload(); albums.quotes.preload();
    next();
  });
  setInterval(loadState, 5 * 60000);
  setInterval(loadEvents, 10 * 60000);
  setInterval(loadLunch, 3 * 3600000);
  setInterval(loadWeather, 20 * 60000);
  setInterval(loadSports, 3 * 60000);
  setInterval(loadFantasy, 3 * 60000);
  setInterval(loadNotes, 10 * 60000);
  setInterval(loadToday, 30 * 60000);   // picks up the new day (and retries if a source was down)
})();
</script>
</body>
</html>
